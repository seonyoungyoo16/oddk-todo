name: Verify and deploy GitHub Pages
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'
      - run: deno check supabase/functions/plan-sync/account.ts supabase/functions/travel-lookup/index.ts supabase/functions/task-maintenance/index.ts supabase/functions/push-subscriptions/index.ts
      - run: deno check --config supabase/functions/push-worker/deno.json --frozen supabase/functions/push-worker/index.ts supabase/functions/push-receipt/index.ts
      - run: deno test tests/unit/plan-validation.test.mjs tests/unit/plan-v4.test.mjs tests/unit/plan-v5.test.mjs tests/unit/schedule.test.mjs tests/unit/editor-schedule.test.mjs tests/unit/availability.test.mjs tests/unit/availability-draft.test.mjs tests/unit/classification.test.mjs tests/unit/task-order.test.mjs tests/unit/bulk-actions.test.mjs tests/unit/goal-tree.test.mjs tests/unit/travel.test.mjs tests/unit/travel-handler.test.mjs tests/unit/task-movement.test.mjs tests/unit/repeat-calendar.test.mjs tests/unit/recurrence.test.mjs tests/unit/repeat-editor.test.mjs tests/unit/repeat-window.test.mjs tests/unit/task-maintenance.test.mjs tests/unit/push-subscriptions.test.mjs tests/unit/push-reminder.test.mjs tests/unit/push-worker.test.mjs tests/unit/push-receipt.test.mjs
      - run: deno test --config supabase/functions/push-worker/deno.json --frozen --allow-env=ECE_KEYLOG,DEBUG,NODE_DEBUG tests/edge/web-push-crypto.test.mjs
      - run: deno test --config supabase/functions/push-worker/deno.json --frozen --allow-env=ECE_KEYLOG tests/edge/keylog-guard.test.mjs
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: out
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
