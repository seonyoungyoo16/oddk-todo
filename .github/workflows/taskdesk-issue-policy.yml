name: TaskDesk issue policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to check
        required: true
        type: number

permissions:
  checks: write
  issues: read
  pull-requests: read

concurrency:
  group: taskdesk-issue-policy-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Verify linked issue on the pull request head
        shell: bash
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          sha="$(jq -r .head.sha <<< "$pr")"
          ref="$(jq -r .head.ref <<< "$pr")"
          base="$(jq -r .base.ref <<< "$pr")"
          default_branch="$(jq -r .base.repo.default_branch <<< "$pr")"
          pr_created="$(jq -r .created_at <<< "$pr")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$base" != main && "$base" != "$default_branch" ]]; then exit 0; fi
          endpoint="repos/$GITHUB_REPOSITORY/check-runs"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          check_id="$(gh api --method POST "$endpoint" -f name="TaskDesk / linked issue" \
            -f head_sha="$sha" -f status=in_progress -f details_url="$url" --jq .id)"
          finish() {
            gh api --method PATCH "$endpoint/$check_id" -f status=completed -f conclusion="$1" \
              -f "output[title]=$2" -f "output[summary]=$3" >/dev/null
          }
          fail_check() {
            finish failure "Linked issue required" "$1"
            exit 1
          }
          if [[ ! "$ref" =~ ^issue/([1-9][0-9]*)-[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            fail_check "Use issue/NUMBER-description for the pull request branch."
          fi
          issue="${BASH_REMATCH[1]}"
          if ! issue_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue")"; then
            fail_check "The branch must reference an issue in this repository."
          fi
          created="$(jq -r 'if .pull_request then "" else (.created_at // "") end' <<< "$issue_json")"
          if [[ ! "$created" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ || "$created" > "$pr_created" ]]; then
            fail_check "Create the issue in this repository before opening the PR."
          fi
          body="$(jq -r '.body // ""' <<< "$pr" | tr -d '\r')"
          if ! grep -Eiq "^[[:blank:]]*Closes[[:blank:]]+#${issue}[[:blank:]]*$" <<< "$body"; then
            fail_check "Add a separate Closes #$issue line to the PR description."
          fi
          finish success "Verified issue #$issue" "The work branch and PR both reference issue #$issue."
